# Copy this file to .github/workflows/android.yml to enable automatic GitHub Actions builds.
# The repository connector currently cannot write workflow files directly.
name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/EpilepsySafetyFilter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: epilepsy-safety-filter-debug-apk
          path: android/EpilepsySafetyFilter/app/build/outputs/apk/debug/app-debug.apk
